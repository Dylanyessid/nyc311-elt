[project]
name = "nyc311-elt"
version = "0.1.0"
description = "ELT de servicios de la ciudad de Nueva York"
readme = "README.md"
authors = [
    { name = "Dylanyessid", email = "dylanyessid1904@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
]

[project.scripts]
nyc311-elt = "nyc311_elt:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dbt = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"